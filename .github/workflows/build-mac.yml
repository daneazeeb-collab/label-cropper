name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Two kinds of Mac build machine, so one busy pool doesn't block a release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: AppleSilicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-test the code
        run: python label_cropper.py --selftest

      - name: Build Label Cropper.app
        run: |
          pyinstaller --noconfirm --windowed \
            --name "Label Cropper" \
            --icon assets/icon.icns \
            --osx-bundle-identifier com.danezeeb.labelcropper \
            --add-data "app.html:." \
            --hidden-import updater \
            --exclude-module tkinter --exclude-module _tkinter --exclude-module test \
            --collect-all pypdfium2 --collect-all pypdfium2_raw \
            label_cropper.py
          APP="dist/Label Cropper.app"
          PLIST="$APP/Contents/Info.plist"
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$PLIST"
          plutil -replace CFBundleVersion -string "$VERSION" "$PLIST"
          plutil -replace NSHighResolutionCapable -bool true "$PLIST"
          plutil -replace LSMinimumSystemVersion -string "12.0" "$PLIST"
          plutil -replace NSDocumentsFolderUsageDescription -string "Label Cropper opens and saves the shipping labels you choose." "$PLIST"
          plutil -replace NSDesktopFolderUsageDescription -string "Label Cropper opens and saves the shipping labels you choose." "$PLIST"
          plutil -replace NSDownloadsFolderUsageDescription -string "Label Cropper opens and saves the shipping labels you choose." "$PLIST"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Self-test the packaged app
        run: '"dist/Label Cropper.app/Contents/MacOS/Label Cropper" --selftest'

      - name: Measure startup and size
        run: |
          APP="dist/Label Cropper.app"
          echo "App size: $(du -sh "$APP" | cut -f1), files: $(find "$APP" -type f | wc -l | tr -d ' ')"
          echo "Largest parts:"; du -sk "$APP"/Contents/*/* 2>/dev/null | sort -rn | head -12
          for run in first second third; do
            echo "--- $run launch"
            /usr/bin/time -p "$APP/Contents/MacOS/Label Cropper" --startup-timing 2>&1 | grep -E "^\[|^real"
          done

      - name: Make installer disk image
        run: |
          mkdir dmg
          cp -R "dist/Label Cropper.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Label Cropper" -srcfolder dmg -ov -format UDZO "Label-Cropper-${{ matrix.arch }}.dmg"
          hdiutil verify "Label-Cropper-${{ matrix.arch }}.dmg"
          ls -lh "Label-Cropper-${{ matrix.arch }}.dmg"
          shasum -a 256 "Label-Cropper-${{ matrix.arch }}.dmg" > "Label-Cropper-${{ matrix.arch }}.dmg.sha256"
          cat "Label-Cropper-${{ matrix.arch }}.dmg.sha256"

      - name: Test a real in-app update
        run: python label_cropper.py --update-selftest "Label-Cropper-${{ matrix.arch }}.dmg" "1.0.${GITHUB_RUN_NUMBER}"

      - uses: actions/upload-artifact@v4
        with:
          name: Label-Cropper-${{ matrix.arch }}
          path: |
            Label-Cropper-${{ matrix.arch }}.dmg
            Label-Cropper-${{ matrix.arch }}.dmg.sha256
          retention-days: 90

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          FILE="Label-Cropper-${{ matrix.arch }}.dmg"
          git log -1 --pretty='%s%n%n%b' | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
          # whichever machine finishes first creates the release; the other adds its files
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Label Cropper $TAG" \
            --notes-file notes.txt --latest 2>/dev/null || true
          gh release upload "$TAG" "$FILE" "$FILE.sha256" --repo "$GITHUB_REPOSITORY" --clobber

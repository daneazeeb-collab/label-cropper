name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest      # Apple Silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-test the code
        run: python label_cropper.py --selftest

      - name: Build Label Cropper.app
        run: |
          pyinstaller --noconfirm --windowed \
            --name "Label Cropper" \
            --icon assets/icon.icns \
            --osx-bundle-identifier com.danezeeb.labelcropper \
            --add-data "app.html:." \
            --collect-all pypdfium2 --collect-all pypdfium2_raw \
            label_cropper.py
          APP="dist/Label Cropper.app"
          PLIST="$APP/Contents/Info.plist"
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$PLIST"
          plutil -replace CFBundleVersion -string "$VERSION" "$PLIST"
          plutil -replace NSHighResolutionCapable -bool true "$PLIST"
          plutil -replace LSMinimumSystemVersion -string "12.0" "$PLIST"
          plutil -replace NSDocumentsFolderUsageDescription -string "Label Cropper opens and saves the shipping labels you choose." "$PLIST"
          plutil -replace NSDesktopFolderUsageDescription -string "Label Cropper opens and saves the shipping labels you choose." "$PLIST"
          plutil -replace NSDownloadsFolderUsageDescription -string "Label Cropper opens and saves the shipping labels you choose." "$PLIST"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Self-test the packaged app
        run: '"dist/Label Cropper.app/Contents/MacOS/Label Cropper" --selftest'

      - name: Make installer disk image
        run: |
          mkdir dmg
          cp -R "dist/Label Cropper.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Label Cropper" -srcfolder dmg -ov -format UDZO "Label-Cropper.dmg"
          hdiutil verify "Label-Cropper.dmg"
          ls -lh "Label-Cropper.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Label-Cropper-mac
          path: Label-Cropper.dmg
          retention-days: 90
